name: Release

# Changesets release flow. A push to main either opens or updates a "Version
# Packages" pull request (when there are unconsumed changesets), or publishes
# (when that pull request is merged). This replaces the previous per-package tag
# trigger, which required one commit per package because a single commit can
# only carry one tag.
#
# The filename is deliberate: npm's trusted-publisher entries for BOTH packages
# name `publish.yml`, and npm matches on the workflow filename. Renaming this
# file means updating the entry on npmjs.com for every package.
#
# Auth: npm trusted publishing (OIDC). No NPM_TOKEN secret is required, and one
# must not be set — a static `_authToken` in .npmrc makes npm skip its OIDC
# exchange, which is the cause of every "misleading 404" report in this area.
#   npmjs.com -> package -> Settings -> Trusted publishing -> GitHub Actions
#     Organization/user: mohan-cao
#     Repository:        pi-extensions
#     Workflow filename: publish.yml
#     Allowed actions:   npm publish, npm stage publish

on:
  push:
    branches:
      - main

# Each job declares its own permissions; the select-mode and version jobs must
# not be able to reach the registry.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Changesets needs history to work out what is already released.
          fetch-depth: 0

      # pnpm/action-setup is the correct action for pnpm v10 and older
      # (pnpm/setup is only for v11+). Version matches packageManager.
      - uses: pnpm/action-setup@v6
        with:
          version: "10.18.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The tracked pnpm-lock.yaml is the only lockfile in the repo.
      - run: pnpm install --frozen-lockfile

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Commit the version bumps and push the release branch.
      contents: write
      # Open or update the Version Packages pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: "10.18.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: pnpm install --frozen-lockfile

      # Applies the pending changesets: bumps the declared packages, and bumps
      # their dependants by `updateInternalDependencies` so the range follows.
      - uses: changesets/action/version@v2
        with:
          script: pnpm changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Create the release tags and the GitHub releases.
      contents: write
      # npm trusted publishing: lets GitHub mint the OIDC token that npm
      # exchanges for a short-lived, workflow-scoped publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: "10.18.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Fail closed: do not publish a package that does not build or test.
      - run: pnpm -r build
      - run: pnpm -r test

      # Publishes every package changesets considers ready, in dependency
      # order, and creates the matching tags. `prepack` builds, and the pnpm
      # pack path rewrites `workspace:` ranges to concrete ones — `npm publish`
      # would ship the protocol verbatim and no consumer could resolve it
      # (EUNSUPPORTEDPROTOCOL).
      - uses: changesets/action/publish@v2
        with:
          script: pnpm changeset publish
