name: Publish to npm

# Publishes a single workspace package when a `<package-name>@<version>` tag is
# pushed, e.g. @mohan-cao/pi-jev-response-router@0.2.0
#
# Per-package tags mean releasing one package never requires bumping or tagging
# the others, and adding a new package needs no change to this workflow.
#
# Auth: npm trusted publishing (OIDC). No NPM_TOKEN secret is required.
# One-time npm setup, per package (the package must exist on npm first):
#   npmjs.com -> package -> Settings -> Trusted publishing -> GitHub Actions
#     Organization/user: mohan-cao
#     Repository:        pi-extensions
#     Workflow filename: publish.yml
#     Allowed actions:   npm publish

on:
  push:
    tags:
      # `*` does not match `/`, so `**` is required to span the scope slash.
      - "**@*"

permissions:
  contents: read
  # Required for npm trusted publishing: lets GitHub mint the OIDC token that
  # npm exchanges for a short-lived, workflow-scoped publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm/action-setup is the correct action for pnpm v10 and older
      # (pnpm/setup is only for v11+). Version matches packageManager.
      - uses: pnpm/action-setup@v6
        with:
          version: "10.18.0"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The tracked pnpm-lock.yaml is the only lockfile in the repo.
      - run: pnpm install --frozen-lockfile

      # Fails if the tag is not <name>@<version>, names an unknown package, or
      # disagrees with the manifest version.
      - name: Resolve package from tag
        id: pkg
        run: node scripts/resolve-package.mjs "$GITHUB_REF_NAME"

      # `pkg...` includes workspace dependencies, so this stays correct if a
      # package ever depends on another package in this repo.
      - run: pnpm --filter "${{ steps.pkg.outputs.name }}..." build
      - run: pnpm --filter "${{ steps.pkg.outputs.name }}..." --if-present test

      # npm (not pnpm) performs the publish so trusted publishing/OIDC works.
      # `prepack` rebuilds the package; provenance is generated automatically.
      - run: npm publish "./${{ steps.pkg.outputs.dir }}" --access public
